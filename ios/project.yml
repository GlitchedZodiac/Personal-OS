# XcodeGen manifest — regenerate the project after adding/removing files:
#   cd ios && xcodegen generate
# (project.pbxproj is generated output; this file is the source of truth.)

name: PersonalOS
options:
  bundleIdPrefix: net.blacksheepglobal
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Michael's personal team (picked in Xcode 2026-08-09); keeping it here
    # means `xcodegen generate` never loses signing.
    DEVELOPMENT_TEAM: HDR67SL3JG
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PersonalOS:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Shared
      - path: iPhone
    dependencies:
      - target: PersonalOS PhoneWidgets
        embed: true
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Pitaya
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad (2026-08-22, Spirit desk): landscape-first, every orientation,
        # and NOT full-screen-only so Split View beside Logos works.
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight,
           UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: false
        # DEBUG smoke against `npm run dev` (pitaya.devOrigin → http://localhost:3000)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: >-
          Pitaya reads your weight, sleep, heart data, and activity from
          Apple Health to sync your dashboard automatically.
        NSHealthUpdateUsageDescription: >-
          Pitaya saves workouts you record to Apple Health.
        NSMicrophoneUsageDescription: >-
          Pitaya uses the microphone for voice logging — granted once here,
          never asked again.
        NSCameraUsageDescription: >-
          Pitaya uses the camera for meal photos and label scans.
        CFBundleURLTypes:
          - CFBundleURLName: net.blacksheepglobal.pitaya
            CFBundleURLSchemes: [pitaya]
        # Standard HTTPS only — declares the export-compliance exemption so
        # App Store Connect never asks the encryption question per upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOSApp/PersonalOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        # §09 2f: the phone widgets read the companion's bearer session.
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.blacksheepglobal.pitaya.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.blacksheepglobal.pitaya
        # 1 = iPhone, 2 = iPad — the desk lives on the iPad (2026-08-22)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PersonalOS Watch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: WatchApp/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: PersonalOS WatchWidgets
        embed: true
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Pitaya
        WKApplication: true
        # Standalone watch app — no iOS companion required (the iOS target
        # above is a sibling, not a host; revisit if we ever embed).
        WKWatchOnly: true
        WKBackgroundModes: [workout-processing, location]
        # CoreLocation validates against UIBackgroundModes even on watchOS —
        # without it, allowsBackgroundLocationUpdates throws (crashed a sim
        # walk before this was here).
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: >-
          Pitaya records your route and distance during outdoor walks, runs,
          and hikes.
        UIAppFonts:
          - FamiljenGrotesk-Regular.ttf
          - FamiljenGrotesk-Medium.ttf
          - FamiljenGrotesk-SemiBold.ttf
          - FamiljenGrotesk-Bold.ttf
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
        NSHealthShareUsageDescription: >-
          Pitaya reads heart rate, calories, and steps to show live workout
          metrics and sync your training.
        NSHealthUpdateUsageDescription: >-
          Pitaya saves workouts you record on the watch to Apple Health.
        NSMotionUsageDescription: >-
          Pitaya reads elevation from the barometer during outdoor workouts.
        # Same export-compliance exemption as the iOS app (HTTPS only).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: WatchApp/PersonalOSWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Widget extension reads the app's bearer session (Round 1+2 §02).
        # Keychain sharing is allowed on free personal teams (app groups and
        # APNs are not — the aps-environment provisioning incident).
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.blacksheepglobal.pitaya.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.blacksheepglobal.pitaya.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PersonalOS WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      # Real timeline (Round 1+2 §02): the widget fetches /api/mobile/summary
      # itself, so it needs the shared client/models/keychain + Theme.
      - path: Shared
      - path: WatchApp/Fonts
        type: folder
        buildPhase: resources
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pitaya
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The folder reference lands the ttfs under Fonts/ in the appex (the
        # app also gets flat copies from its WatchApp source path; this
        # target doesn't) — UIAppFonts paths are bundle-root relative.
        UIAppFonts:
          - Fonts/FamiljenGrotesk-Regular.ttf
          - Fonts/FamiljenGrotesk-Medium.ttf
          - Fonts/FamiljenGrotesk-SemiBold.ttf
          - Fonts/FamiljenGrotesk-Bold.ttf
          - Fonts/InstrumentSans-Regular.ttf
          - Fonts/InstrumentSans-Medium.ttf
          - Fonts/InstrumentSans-SemiBold.ttf
    entitlements:
      path: WatchWidgets/PitayaWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.blacksheepglobal.pitaya.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.blacksheepglobal.pitaya.watchkitapp.widgets
        SKIP_INSTALL: YES

  PersonalOS PhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneWidgets
      - path: Shared
      - path: WatchApp/Fonts
        type: folder
        buildPhase: resources
    info:
      path: PhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pitaya
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fonts/FamiljenGrotesk-Regular.ttf
          - Fonts/FamiljenGrotesk-Medium.ttf
          - Fonts/FamiljenGrotesk-SemiBold.ttf
          - Fonts/FamiljenGrotesk-Bold.ttf
          - Fonts/InstrumentSans-Regular.ttf
          - Fonts/InstrumentSans-Medium.ttf
          - Fonts/InstrumentSans-SemiBold.ttf
    entitlements:
      path: PhoneWidgets/PitayaPhoneWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.blacksheepglobal.pitaya.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.blacksheepglobal.pitaya.phonewidgets
        SKIP_INSTALL: YES

schemes:
  PersonalOS:
    build:
      targets: { PersonalOS: all }
    run:
      config: Debug
  PersonalOS Watch:
    build:
      targets: { PersonalOS Watch: all }
    run:
      config: Debug
